name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_mcp_only:
        description: 'Skip semantic-release; publish current package.json version to the MCP Registry only'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Typecheck
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_mcp_only != true }}
        run: npm run typecheck

      - name: Test
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_mcp_only != true }}
        run: npm test

      - name: Build
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_mcp_only != true }}
        run: npm run build

      - name: Release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_mcp_only != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -o pipefail
          npx semantic-release | tee semantic-release.log

      - name: Publish to MCP Registry
        run: |
          set -euo pipefail

          PUBLISH_MCP_ONLY="${{ github.event_name == 'workflow_dispatch' && inputs.publish_mcp_only || false }}"
          if [ "$PUBLISH_MCP_ONLY" != "true" ]; then
            if [ ! -f semantic-release.log ] || ! grep -q "Published release" semantic-release.log; then
              echo "No npm release; skipping MCP Registry"
              exit 0
            fi
          fi

          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json

          # npm can take minutes to make a just-published scoped package queryable.
          # The MCP Registry validates the exact version exists before accepting metadata.
          echo "Waiting for ${NAME}@${VERSION} on npm..."
          for i in $(seq 1 36); do
            if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "Found ${NAME}@${VERSION} on npm (attempt ${i})"
              break
            fi
            if [ "$i" -eq 36 ]; then
              echo "Timed out waiting for ${NAME}@${VERSION} on npm after 6 minutes"
              exit 1
            fi
            echo "Attempt ${i}: not visible yet; sleeping 10s"
            sleep 10
          done

          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
